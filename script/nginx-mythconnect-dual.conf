# ==============================================================================
# Myth Connect.ai - Production Nginx Reverse Proxy Configuration
# Target File: /etc/nginx/sites-available/mythconnect.conf
# Symlink:     /etc/nginx/sites-enabled/mythconnect.conf
#
# Domains:
#   1. Frontend SPA:     mythconnect.mugaitechnologies.in      -> http://127.0.0.1:__FRONTEND_PORT__
#   2. Backend REST/WS:  mythconnect-api.mugaitechnologies.in  -> http://127.0.0.1:__BACKEND_PORT__
#
# NOTE: This file is completely independent and does NOT overwrite or touch
# any existing Nginx configuration on this server.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. FRONTEND WEB APPLICATION (mythconnect.mugaitechnologies.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mythconnect.mugaitechnologies.in;

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Reverse proxy to the frontend service port
    location / {
        proxy_pass http://127.0.0.1:__FRONTEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ------------------------------------------------------------------------------
# 2. BACKEND API & REALTIME WEBSOCKET GATEWAY (mythconnect-api.mugaitechnologies.in)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name mythconnect-api.mugaitechnologies.in;

    # Max body size for file/lead uploads and attachments
    client_max_body_size 50M;

    # Let's Encrypt ACME challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Realtime WebSocket Gateway (/ws)
    location /ws {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeouts for persistent WebSocket connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # REST APIs & Webhooks Gateway
    location / {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

